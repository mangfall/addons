name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp mangfall-cards/app/mangfall-cards.js mangfall-cards.js
      - uses: softprops/action-gh-release@v2
        with:
          files: mangfall-cards.js
          generate_release_notes: true
